<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="727" viewBox="0 0 1200 727"><rect width="1200" height="727" fill="#0b1220"/><rect x="0" y="0" width="1200" height="6" fill="#4ade80"/><text x="48" y="58" font-family="&#39;DejaVu Sans Mono&#39;,&#39;Courier New&#39;, monospace" font-size="14" fill="#4ade80" font-weight="700" text-anchor="start" letter-spacing="3">WHAT THE CHECK FOUND</text><text x="48" y="96" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#e6edf6" font-weight="700" text-anchor="start">Three steps to goods delivered and never paid for</text><text x="48" y="128" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#93a1b5" font-weight="400" text-anchor="start">One guard was removed: the check that stops an order shipping before its payment succeeds. Polygraph then tried every order of events the</text><text x="48" y="158" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#93a1b5" font-weight="400" text-anchor="start">machine allows.</text><text x="48" y="697" font-family="&#39;DejaVu Sans Mono&#39;,&#39;Courier New&#39;, monospace" font-size="13" fill="#93a1b5" font-weight="700" text-anchor="start" letter-spacing="3">COGNITIVE FAB · POLYGRAPH</text><text x="1152" y="697" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#93a1b5" font-style="italic" text-anchor="end">Provable Trust</text><rect x="48" y="234" width="173" height="58" rx="10" fill="#131c30" stroke="#26344a" stroke-width="2"/><text x="134.5" y="268.58" font-family="&#39;DejaVu Sans Mono&#39;,&#39;Courier New&#39;, monospace" font-size="15.5" fill="#e6edf6" font-weight="700" text-anchor="middle">submit(Alice)</text><line x1="223" y1="263" x2="239" y2="263" stroke="#93a1b5" stroke-width="2.2" stroke-linecap="round"/><polygon points="239,263 230,258 230,268" fill="#93a1b5"></polygon><rect x="243" y="234" width="140" height="58" rx="10" fill="#131c30" stroke="#26344a" stroke-width="2"/><text x="313" y="268.58" font-family="&#39;DejaVu Sans Mono&#39;,&#39;Courier New&#39;, monospace" font-size="15.5" fill="#e6edf6" font-weight="700" text-anchor="middle">ship()</text><line x1="385" y1="263" x2="401" y2="263" stroke="#93a1b5" stroke-width="2.2" stroke-linecap="round"/><polygon points="401,263 392,258 392,268" fill="#93a1b5"></polygon><rect x="405" y="234" width="140" height="58" rx="10" fill="#131c30" stroke="#f87171" stroke-width="2"/><text x="475" y="268.58" font-family="&#39;DejaVu Sans Mono&#39;,&#39;Courier New&#39;, monospace" font-size="15.5" fill="#f87171" font-weight="700" text-anchor="middle">deliver()</text><rect x="48" y="344" width="1104" height="103" rx="14" fill="#1c1013" stroke="#f87171" stroke-width="2"/><text x="74" y="386" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#f87171" font-weight="800" text-anchor="start">✗ RULE BROKEN — delivered, never charged</text><text x="74" y="419" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#e6edf6" font-weight="400" text-anchor="start">The order reached DELIVERED while charged was still false. Each step on its own was permitted; the sequence is what breaks the rule.</text><rect x="48" y="475" width="1104" height="182" rx="14" fill="#131c30" stroke="#26344a" stroke-width="1.5"/><text x="74" y="519" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#4ade80" font-weight="700" text-anchor="start">Nobody wrote this test.</text><text x="74" y="557" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#93a1b5" font-weight="400" text-anchor="start">Polygraph explored every state the order can reach, found the one that breaks the rule, and returned the shortest way to get there. The path is</text><text x="74" y="581" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#93a1b5" font-weight="400" text-anchor="start">executable, so it becomes a regression test.</text><text x="74" y="621" font-family="&#39;DejaVu Sans Mono&#39;,&#39;Courier New&#39;, monospace" font-size="15.5" fill="#e6edf6" font-weight="400" text-anchor="start">Point the same check at the clean build</text><text x="466.7" y="621" font-family="&#39;DejaVu Sans Mono&#39;,&#39;Courier New&#39;, monospace" font-size="15.5" fill="#4ade80" font-weight="700" text-anchor="start">→  it passes.  ✓</text></svg>